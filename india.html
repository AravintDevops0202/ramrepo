<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eaeded;
        }

        .navbar {
            background-color: #131921;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .hero {
            background-color: #febd69;
            padding: 40px;
            text-align: center;
        }

        .products {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 20px;
        }

        .product {
            background-color: white;
            width: 250px;
            padding: 15px;
            margin: 10px;
            text-align: center;
            border-radius: 5px;
        }

        .product img {
            width: 100%;
            height: 180px;
        }

        button {
            background-color: #ffd814;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        footer {
            background-color: #232f3e;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>Amazon Clone</h1>
    </div>

    <div class="hero">
        <h2>Welcome to Our Online Store</h2>
        <p>Best Deals on Electronics, Fashion, and More!</p>
    </div>

    <div class="products">

        <div class="product">
            <img src="https://via.placeholder.com/250x180" alt="Laptop">
            <h3>Laptop</h3>
            <p>₹50,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/250x180" alt="Mobile">
            <h3>Smart Phone</h3>
            <p>₹20,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/250x180" alt="Headphones">
            <h3>Headphones</h3>
            <p>₹1,500</p>
            <button>Add to Cart</button>
        </div>

    </div>

    <footer>
        © 2026 Amazon Clone Project
    </footer>

</body>
</html>
